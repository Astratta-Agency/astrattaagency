name: Blog images

# v2 — cambios frente a la primera versión:
#   · Si falta el spec, FALLA con mensaje claro en vez de seguir en silencio
#     (seguir en silencio garantizaba que el build fallara después por .webp inexistentes).
#   · Verifica que las .webp esperadas se hayan creado de verdad.
#   · Escribe .blog-status.txt SIEMPRE (if: always()), también cuando fallan las imágenes,
#     para que la routine no se quede 12 minutos esperando un archivo que nunca llega.
#   · Tres estados posibles: BUILD_OK · IMAGES_FAIL · BUILD_FAIL

on:
  push:
    branches:
      - 'blog/**'

permissions:
  contents: write

concurrency:
  group: blog-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # Node 24: es el que usa el proyecto en Vercel (nodeVersion 24.x).
      # La v1 pedía Node 20 y el build no tiene por qué pasar en esa versión.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve slug from branch
        id: slug
        run: |
          branch="${GITHUB_REF_NAME}"
          slug="${branch#blog/}"
          slug="$(printf '%s' "$slug" | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-//')"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "Slug resuelto: $slug"

      - name: Generate images
        id: images
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          set -o pipefail
          spec=".blog-specs/${SLUG}.json"

          if [ ! -f "$spec" ]; then
            echo "::error::No existe $spec"
            echo "El nombre de la rama tiene que ser blog/YYYY-MM-DD-<slug>, y el spec"
            echo ".blog-specs/<slug>.json con exactamente ese mismo slug."
            echo "Specs presentes en el repo:"
            ls -1 .blog-specs/ 2>/dev/null || echo "  (no existe el directorio .blog-specs/)"
            exit 1
          fi

          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::error::GEMINI_API_KEY vacío. Revisa Settings → Secrets and variables → Actions."
            exit 1
          fi

          node scripts/blog-images.mjs --slug "$SLUG" --spec "$spec" 2>&1 | tee images.log

          # Verificar que las .webp existen de verdad, no solo que el script salió con 0
          missing=0
          expected="src/assets/blog/${SLUG}-cover.webp"
          for name in $(jq -r '.inline[]?.name' "$spec"); do
            expected="$expected src/assets/blog/${SLUG}-${name}.webp"
          done
          for f in $expected; do
            if [ ! -f "$f" ]; then
              echo "::error::Falta $f — el script salió con 0 pero no escribió el archivo."
              missing=1
            else
              echo "OK $f ($(du -h "$f" | cut -f1))"
            fi
          done
          exit $missing

      - name: Build
        id: build
        if: steps.images.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Write status and push back
        if: always()
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "${{ steps.images.outcome }}" != "success" ]; then
            printf 'IMAGES_FAIL\n%s\n' "$run_url" > .blog-status.txt
            echo '--- últimas 40 líneas del paso de imágenes ---' >> .blog-status.txt
            tail -n 40 images.log >> .blog-status.txt 2>/dev/null || echo '(sin log)' >> .blog-status.txt
          elif [ "${{ steps.build.outcome }}" = "success" ]; then
            printf 'BUILD_OK\n%s\n' "$run_url" > .blog-status.txt
          else
            printf 'BUILD_FAIL\n%s\n' "$run_url" > .blog-status.txt
            echo '--- últimas 40 líneas del build ---' >> .blog-status.txt
            tail -n 40 build.log >> .blog-status.txt 2>/dev/null || echo '(sin log)' >> .blog-status.txt
          fi

          rm -f build.log images.log

          git config user.name  "astratta-blog-bot"
          git config user.email "info@astrattaagency.com"
          git add src/assets/blog .blog-status.txt 2>/dev/null || git add .blog-status.txt
          if git diff --cached --quiet; then
            echo "Nada que commitear."
            exit 0
          fi
          git commit -m "chore(blog): imágenes y estado de build [skip ci]"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Fail the run if something broke
        if: steps.images.outcome != 'success' || steps.build.outcome != 'success'
        run: |
          echo "Falló el workflow. El detalle está en .blog-status.txt de la rama."
          exit 1
